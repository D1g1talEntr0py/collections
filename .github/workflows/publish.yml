name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - run: sudo npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Validate release policy
        run: |
          pnpm exec tsc --project scripts/tsconfig.json
          node --test scripts/tests/release-policy.ts
      - name: Determine release version
        id: release
        run: |
          VERSION=$(node scripts/release-version.ts)
          if [[ -n "$VERSION" ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Prepare and validate release
        if: steps.release.outputs.version != ''
        run: |
          git-cliff --github-repo "$GITHUB_REPOSITORY" --tag "v$VERSION" --unreleased --strip header --output "$RUNNER_TEMP/release-notes.md"
          git-cliff --github-repo "$GITHUB_REPOSITORY" --tag "v$VERSION" --output CHANGELOG.md
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          pnpm lint
          pnpm type-check
          pnpm test:coverage
          pnpm build --minify
          pnpm pack --out "$RUNNER_TEMP/d1g1tal-collections-$VERSION.tgz"
          tar -tzf "$RUNNER_TEMP/d1g1tal-collections-$VERSION.tgz" > "$RUNNER_TEMP/package-files.txt"
          for FILE in package/dist/index.js package/dist/index.d.ts package/README.md package/LICENSE package/docs/migration-v5.md; do
            grep -Fx "$FILE" "$RUNNER_TEMP/package-files.txt"
          done
        env:
          VERSION: ${{ steps.release.outputs.version }}
      - name: Publish and record release
        if: steps.release.outputs.version != ''
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main changed during release preparation; refusing to publish a stale checkout"
            exit 1
          fi
          pnpm publish "$RUNNER_TEMP/d1g1tal-collections-$VERSION.tgz" --no-git-checks --provenance
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/d1g1tal-collections-$VERSION.tgz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
